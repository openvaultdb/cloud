name: Cloud Worker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  # The shared Go workflow declares write permission for its gated release job.
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Worker facade, assets, and deployment bundle
        run: npm run check

  verify_sample_database_service:
    # Share the fleet's Go lint/test/build and artifact gate with Sneat Go.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.20.0
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      working_directory: server
      go_version: '1.27.0'
      disable-version-bumping: true
      build_command: |
        mkdir -p fixture/output
        python3 prepare_fixture.py fixture/Chinook_Sqlite.sqlite fixture/output chinook 7651ba378ac2fcd0dfc3c66fb101f7a7eed3ba39a612ec642b96e20702061f15 legacy
        curl --fail --silent --show-error --location \
          https://raw.githubusercontent.com/demo-db/northwind/8e9755ae30bb99f15601a7dd3833199f59d37035/artifacts/northwind.sqlite \
          --output "${RUNNER_TEMP}/northwind.sqlite"
        python3 prepare_fixture.py "${RUNNER_TEMP}/northwind.sqlite" fixture/output northwind 279b34136771aee75d802094b3329515a2b01da65d2a20a4a9e3b58c29b4fd20 natural
        curl --fail --silent --show-error --location \
          https://raw.githubusercontent.com/demo-db/northwind/8e9755ae30bb99f15601a7dd3833199f59d37035/data-source/LICENSE.md \
          --output fixture/output/NORTHWIND-UPSTREAM-LICENSE.md
        echo "CHINOOK_MANIFEST=${PWD}/fixture/output/chinook.yaml" >> "${GITHUB_ENV}"
        echo "NORTHWIND_MANIFEST=${PWD}/fixture/output/northwind.yaml" >> "${GITHUB_ENV}"
        GOCACHE="${RUNNER_TEMP}/go-cache" go test ./... -run 'TestPublic(Chinook|Northwind)Journey' -count=1
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ovdb-cloud .
        chmod +x ovdb-cloud
        sha256sum ovdb-cloud > ovdb-cloud.sha256
        printf '%s\n' "${GITHUB_SHA}" > ovdb-cloud.source-sha
      artifact_name: ovdb-cloud-linux-amd64
      artifact_path: |
        server/ovdb-cloud
        server/ovdb-cloud.sha256
        server/ovdb-cloud.source-sha
        server/fixture/output
      artifact_on_main_only: true
