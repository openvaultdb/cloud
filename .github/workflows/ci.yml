name: Cloud Worker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  # The shared Go workflow declares write permission for its gated release job.
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Worker facade, assets, and deployment bundle
        run: npm run check

  verify_chinook_service:
    # Share the fleet's Go lint/test/build and artifact gate with Sneat Go.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.20.0
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      working_directory: server
      go_version: '1.27.0'
      disable-version-bumping: true
      build_command: |
        python3 prepare_fixture.py fixture/Chinook_Sqlite.sqlite "${RUNNER_TEMP}/chinook-ovdb"
        echo "CHINOOK_MANIFEST=${RUNNER_TEMP}/chinook-ovdb/chinook.yaml" >> "${GITHUB_ENV}"
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ovdb-cloud .
        chmod +x ovdb-cloud
        sha256sum ovdb-cloud > ovdb-cloud.sha256
        printf '%s\n' "${GITHUB_SHA}" > ovdb-cloud.source-sha
      artifact_name: ovdb-cloud-linux-amd64
      artifact_path: |
        server/ovdb-cloud
        server/ovdb-cloud.sha256
        server/ovdb-cloud.source-sha
      artifact_on_main_only: true
