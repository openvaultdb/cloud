name: Deploy Chinook to Cloud Run

on:
  workflow_run:
    workflows: [Cloud Worker CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: openvaultdb-chinook-cloudrun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: openvaultdb
      REGION: europe-west1
      SERVICE_NAME: chinook-ovdb
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: europe-west1-docker.pkg.dev/openvaultdb/chinook-ovdb/server:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Reject an older main commit
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"

      - name: Download the validated Go binary
        uses: actions/download-artifact@v8
        with:
          name: ovdb-cloud-linux-amd64
          path: server
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify binary identity and checksum
        working-directory: server
        run: |
          test "$(cat ovdb-cloud.source-sha)" = "${DEPLOY_SHA}"
          sha256sum --check ovdb-cloud.sha256
          sha256sum --check provider-fixture.tar.sha256
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          # Accept only regular fixture files/directories; never links or escapes.
          with tarfile.open("provider-fixture.tar", "r:") as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  if (path.is_absolute() or ".." in path.parts
                          or path.parts[:2] != ("fixture", "output")
                          or not (member.isfile() or member.isdir())):
                      raise SystemExit(f"unsafe provider fixture archive entry: {member.name}")
              archive.extractall(".", filter="data")

          fixture = Path("fixture/output")
          inventory = json.loads((fixture / "inventory.json").read_text())
          if inventory.get("version") != 2 or not inventory.get("databases"):
              raise SystemExit("missing generated provider inventory")
          for database in inventory["databases"]:
              source_hash = (fixture / f"{database['id']}.source-sha256").read_text().strip()
              license_hash = sha256_file(fixture / database["license"])
              if database.get("storageEngine", "sqlite") == "ingitdb":
                  root = fixture / database["nativeRoot"]
                  actual = []
                  for pin in database["nativeFiles"]:
                      path = root / pin["path"]
                      if sha256_file(path) != pin["sha256"] or path.stat().st_size != pin["bytes"]:
                          raise SystemExit(f"native provider receipt mismatch: {database['id']} {pin['path']}")
                      actual.append(pin["path"])
                  if len(actual) != 8:
                      raise SystemExit("native provider inventory must contain exactly eight files")
                  serving_hash = database["servingSha256"]
              else:
                  serving_hash = sha256_file(fixture / f"{database['id']}.sqlite")
              if source_hash != database["sourceSha256"] or serving_hash != database["servingSha256"] or license_hash != database["licenseSha256"]:
                  raise SystemExit(f"provider receipt mismatch: {database['id']}")
          # data_filter makes files owner-writable; restore the verified image policy.
          for path in fixture.rglob("*"):
              if path.is_symlink() or not (path.is_file() or path.is_dir()):
                  raise SystemExit(f"unexpected extracted fixture entry: {path}")
              path.chmod(0o555 if path.is_dir() else 0o444)
          fixture.chmod(0o555)
          PY
          chmod +x ovdb-cloud

      - name: Authenticate with OpenVaultDB Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/323159488879/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-chinook-deploy@openvaultdb.iam.gserviceaccount.com

      - name: Configure gcloud and Docker
        run: |
          gcloud auth login --brief --cred-file="${{ steps.auth.outputs.credentials_file_path }}"
          gcloud config set project "${PROJECT_ID}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the validated image
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"
          docker build --label "org.opencontainers.image.revision=${DEPLOY_SHA}" --file server/Dockerfile --tag "${IMAGE}" server
          docker push "${IMAGE}"

      - name: Capture rollback target
        working-directory: server
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          from urllib.parse import urlsplit

          def cloud(*args):
              return json.loads(subprocess.check_output(["gcloud", *args, "--project="+os.environ["PROJECT_ID"], "--region="+os.environ["REGION"], "--format=json"], text=True))
          def service():
              return cloud("run", "services", "describe", os.environ["SERVICE_NAME"])
          def revision(name):
              value = cloud("run", "revisions", "describe", name)
              digest = value.get("status", {}).get("imageDigest", "")
              if "@sha256:" not in digest: raise RuntimeError("revision has no resolved immutable digest")
              return {"image": digest, "sourceSha": value.get("metadata", {}).get("labels", {}).get("source-sha")}
          def traffic(value):
              targets = [{"revisionName": target["revisionName"], "percent": target["percent"]} for target in value["status"].get("traffic", []) if target.get("percent", 0) > 0]
              if not targets or sum(target["percent"] for target in targets) != 100: raise RuntimeError("serving traffic is incomplete")
              return sorted(targets, key=lambda target: target["revisionName"])
          def origin(value):
              text = value["status"]["url"]
              url = urlsplit(text)
              if any(ord(char) < 33 for char in text) or url.scheme != "https" or not url.hostname or not url.hostname.endswith(".run.app") or url.netloc != url.hostname or url.path or url.query or url.fragment: raise RuntimeError("invalid Cloud Run origin")
              return text

          value = service()
          targets = traffic(value)
          receipt = {"mergeSha": os.environ["DEPLOY_SHA"], "phase": "captured", "capturedAt": int(time.time()), "serviceOrigin": origin(value), "priorTraffic": targets, "priorRevisions": {target["revisionName"]: revision(target["revisionName"]) for target in targets}}
          # Resolve the exact just-pushed SHA tag before deployment; deploy only this digest.
          digest = subprocess.check_output(["gcloud", "artifacts", "docker", "images", "describe", os.environ["IMAGE"], "--format=value(image_summary.digest)"], text=True).strip()
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest): raise RuntimeError("invalid candidate image digest")
          receipt["candidateImage"] = os.environ["IMAGE"].rsplit(":", 1)[0]+"@"+digest
          Path("shipping-publication-deploy-receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2)+"\n")
          PY

      - name: Deploy the public read-only service
        working-directory: server
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"
          python3 -c 'import json; from pathlib import Path; p=Path("shipping-publication-deploy-receipt.json"); d=json.loads(p.read_text()); d["phase"]="deploy-started"; p.write_text(json.dumps(d))'
          CANDIDATE_IMAGE=$(python3 -c 'import json; print(json.load(open("shipping-publication-deploy-receipt.json"))["candidateImage"])')
          # --concurrency is pinned to the memory arithmetic in server/limits.go.
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${CANDIDATE_IMAGE}" \
            --labels="source-sha=${DEPLOY_SHA}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --service-account=chinook-runtime@openvaultdb.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --concurrency=2 \
            --cpu=1 \
            --timeout=120 \
            --no-traffic \
            --format=json \
            --quiet > candidate-deployment.json

      - name: Record deployed service origin and source
        id: deployment
        working-directory: server
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          from urllib.parse import urlsplit

          def cloud(*args):
              return json.loads(subprocess.check_output(["gcloud", *args, "--project="+os.environ["PROJECT_ID"], "--region="+os.environ["REGION"], "--format=json"], text=True))
          def service():
              return cloud("run", "services", "describe", os.environ["SERVICE_NAME"])
          def revision(name):
              value = cloud("run", "revisions", "describe", name)
              digest = value.get("status", {}).get("imageDigest", "")
              if "@sha256:" not in digest: raise RuntimeError("revision has no resolved immutable digest")
              return {"image": digest, "sourceSha": value.get("metadata", {}).get("labels", {}).get("source-sha")}
          def traffic(value):
              targets = [{"revisionName": target["revisionName"], "percent": target["percent"]} for target in value["status"].get("traffic", []) if target.get("percent", 0) > 0]
              if not targets or sum(target["percent"] for target in targets) != 100: raise RuntimeError("serving traffic is incomplete")
              return sorted(targets, key=lambda target: target["revisionName"])
          def origin(value):
              text = value["status"]["url"]
              url = urlsplit(text)
              if any(ord(char) < 33 for char in text) or url.scheme != "https" or not url.hostname or not url.hostname.endswith(".run.app") or url.netloc != url.hostname or url.path or url.query or url.fragment: raise RuntimeError("invalid Cloud Run origin")
              return text

          path = Path("shipping-publication-deploy-receipt.json")
          receipt = json.loads(path.read_text())
          receipt["phase"]="verify-created-identity"
          path.write_text(json.dumps(receipt))
          created = json.loads(Path("candidate-deployment.json").read_text())
          name = created.get("status", {}).get("latestCreatedRevisionName", "")
          if not re.fullmatch(r"[a-z][a-z0-9-]{0,62}", name): raise RuntimeError("missing created revision identity")
          identity = revision(name)
          if identity["image"] != receipt["candidateImage"] or identity["sourceSha"] != os.environ["DEPLOY_SHA"]: raise RuntimeError("created image/source differs from immutable candidate")
          receipt.update(createdRevision=name, phase="route-created-revision")
          path.write_text(json.dumps(receipt))
          subprocess.run(["gcloud", "run", "services", "update-traffic", os.environ["SERVICE_NAME"], "--to-revisions="+name+"=100", "--project="+os.environ["PROJECT_ID"], "--region="+os.environ["REGION"], "--quiet"], check=True)
          receipt["phase"]="verify-serving-identity"
          path.write_text(json.dumps(receipt))
          value = service()
          targets = traffic(value)
          if len(targets) != 1 or targets[0]["percent"] != 100: raise RuntimeError("candidate must serve all traffic")
          name = targets[0]["revisionName"]
          if name != receipt["createdRevision"]: raise RuntimeError("serving revision differs from created candidate")
          identity = revision(name)
          if identity["image"] != receipt["candidateImage"] or identity["sourceSha"] != os.environ["DEPLOY_SHA"]: raise RuntimeError("serving image/source differs from immutable candidate")
          service_origin = origin(value)
          if service_origin != receipt["serviceOrigin"]: raise RuntimeError("service origin changed")
          receipt.update(deployedRevision=name, deployedImage=identity["image"], deployedSourceSha=identity["sourceSha"], deployedTraffic=targets, deployedAt=int(time.time()))
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2)+"\n")
          Path("chinook-run-origin.txt").write_text(service_origin+"\n")
          Path("chinook-deploy-sha.txt").write_text(os.environ["DEPLOY_SHA"]+"\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream: stream.write("origin="+service_origin+"\n")
          PY

      - name: Verify live profile and cacheable DTQL
        working-directory: server
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"
          python3 -c 'import json; from pathlib import Path; p=Path("shipping-publication-deploy-receipt.json"); d=json.loads(p.read_text()); d["phase"]="live-acceptance"; p.write_text(json.dumps(d))'
          python3 smoke_inventory.py --origin https://cloud.openvaultdb.com --inventory fixture/output/inventory.json --publication-receipt shipping-publication-deploy-receipt.json --receipt shipping-publication-live-pending.json
          # Re-read serving traffic and immutable revision identity after live requests.
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          from urllib.parse import urlsplit

          def cloud(*args):
              return json.loads(subprocess.check_output(["gcloud", *args, "--project="+os.environ["PROJECT_ID"], "--region="+os.environ["REGION"], "--format=json"], text=True))
          def service():
              return cloud("run", "services", "describe", os.environ["SERVICE_NAME"])
          def revision(name):
              value = cloud("run", "revisions", "describe", name)
              digest = value.get("status", {}).get("imageDigest", "")
              if "@sha256:" not in digest: raise RuntimeError("revision has no resolved immutable digest")
              return {"image": digest, "sourceSha": value.get("metadata", {}).get("labels", {}).get("source-sha")}
          def traffic(value):
              targets = [{"revisionName": target["revisionName"], "percent": target["percent"]} for target in value["status"].get("traffic", []) if target.get("percent", 0) > 0]
              if not targets or sum(target["percent"] for target in targets) != 100: raise RuntimeError("serving traffic is incomplete")
              return sorted(targets, key=lambda target: target["revisionName"])
          def origin(value):
              text = value["status"]["url"]
              url = urlsplit(text)
              if any(ord(char) < 33 for char in text) or url.scheme != "https" or not url.hostname or not url.hostname.endswith(".run.app") or url.netloc != url.hostname or url.path or url.query or url.fragment: raise RuntimeError("invalid Cloud Run origin")
              return text

          receipt=json.loads(Path("shipping-publication-deploy-receipt.json").read_text())
          value=service()
          identity=revision(receipt["deployedRevision"])
          if traffic(value) != receipt["deployedTraffic"] or identity["image"] != receipt["deployedImage"] or identity["sourceSha"] != receipt["mergeSha"]: raise RuntimeError("serving identity changed during live acceptance")
          PY
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"
          mv shipping-publication-live-pending.json shipping-publication-live-receipt.json

      - name: Roll back a failed publication
        if: ${{ failure() && hashFiles('server/shipping-publication-deploy-receipt.json') != '' }}
        working-directory: server
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          from urllib.parse import urlsplit

          def cloud(*args):
              return json.loads(subprocess.check_output(["gcloud", *args, "--project="+os.environ["PROJECT_ID"], "--region="+os.environ["REGION"], "--format=json"], text=True))
          def service():
              return cloud("run", "services", "describe", os.environ["SERVICE_NAME"])
          def revision(name):
              value = cloud("run", "revisions", "describe", name)
              digest = value.get("status", {}).get("imageDigest", "")
              if "@sha256:" not in digest: raise RuntimeError("revision has no resolved immutable digest")
              return {"image": digest, "sourceSha": value.get("metadata", {}).get("labels", {}).get("source-sha")}
          def traffic(value):
              targets = [{"revisionName": target["revisionName"], "percent": target["percent"]} for target in value["status"].get("traffic", []) if target.get("percent", 0) > 0]
              if not targets or sum(target["percent"] for target in targets) != 100: raise RuntimeError("serving traffic is incomplete")
              return sorted(targets, key=lambda target: target["revisionName"])
          def origin(value):
              text = value["status"]["url"]
              url = urlsplit(text)
              if any(ord(char) < 33 for char in text) or url.scheme != "https" or not url.hostname or not url.hostname.endswith(".run.app") or url.netloc != url.hostname or url.path or url.query or url.fragment: raise RuntimeError("invalid Cloud Run origin")
              return text

          from tempfile import TemporaryDirectory
          import smoke_inventory as smoke
          path=Path("shipping-publication-deploy-receipt.json")
          deploy=json.loads(path.read_text())
          receipt={"trigger":deploy.get("phase","publication-failure"), "failedMerge":deploy["mergeSha"], "failedImage":deploy["candidateImage"], "failedRevision":deploy.get("deployedRevision"), "startedAt":int(time.time()), "priorTraffic":deploy["priorTraffic"], "restoredRevisions":deploy["priorRevisions"], "checks":[], "errors":[]}
          def check(name, function):
              try:
                  function()
                  receipt["checks"].append({"name":name,"passed":True})
              except Exception as error:
                  receipt["errors"].append({"name":name,"error":str(error)})
                  receipt["checks"].append({"name":name,"passed":False})
          def restore():
              targets=",".join(target["revisionName"]+"="+str(target["percent"]) for target in deploy["priorTraffic"])
              subprocess.run(["gcloud","run","services","update-traffic",os.environ["SERVICE_NAME"],"--project="+os.environ["PROJECT_ID"],"--region="+os.environ["REGION"],"--to-revisions="+targets,"--quiet"],check=True)
          def verify_identity():
              value=service()
              if origin(value) != deploy["serviceOrigin"] or traffic(value) != deploy["priorTraffic"]: raise RuntimeError("restored traffic/origin differs from captured prior state")
              for name, expected in deploy["priorRevisions"].items():
                  if revision(name)["image"] != expected["image"]: raise RuntimeError("restored image digest differs")
          def verify_http():
              inventory=json.loads(Path("fixture/output/inventory.json").read_text())
              inventory["databases"]=[db for db in inventory["databases"] if db["id"] not in ("shipping","shipping-logs")]
              if len(inventory["databases"]) != 6: raise RuntimeError("six established providers required")
              with TemporaryDirectory(prefix="ovdb-rollback-") as scratch:
                  filtered=Path(scratch)/"rollback-inventory.json"
                  filtered.write_text(json.dumps(inventory))
                  subprocess.run(["python3","smoke_inventory.py","--origin","https://cloud.openvaultdb.com","--inventory",str(filtered),"--receipt","rollback-http-receipt.json"],check=True)
          try:
              check("restore-traffic",restore)
              check("restored-immutable-image-and-traffic",verify_identity)
              check("six-provider-queries-and-proxy-pins",verify_http)
              for candidate in ("shipping","shipping-logs"):
                  check("candidate-absent-"+candidate,lambda candidate=candidate: smoke.require_status("https://cloud.openvaultdb.com","/ovdb/dbs/"+candidate,expected=404))
              check("origin-secret-boundary",lambda: smoke.require_status(deploy["serviceOrigin"],"/ovdb/dbs/chinook",expected=403))
          finally:
              receipt["boundaryRequests"]=getattr(smoke,"OBSERVATIONS",[])
              receipt["completedAt"]=int(time.time())
              receipt["verified"]=not receipt["errors"]
              for evidence in ("rollback-http-receipt.json",):
                  if Path(evidence).exists(): receipt[evidence]=json.loads(Path(evidence).read_text())
              Path("shipping-publication-rollback-receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          if receipt["errors"]: raise SystemExit("rollback verification failed; retained failure receipt")
          PY

      - name: Publish deployment metadata for the Worker deploy
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: chinook-cloudrun-deployment
          path: |
            server/chinook-run-origin.txt
            server/chinook-deploy-sha.txt
            server/shipping-publication-deploy-receipt.json
            server/shipping-publication-live-receipt.json
            server/shipping-publication-rollback-receipt.json
          if-no-files-found: error
          retention-days: 7
