name: Deploy OVDB Go gateway

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful exact-main Go CI run with immutable artifact
        required: true
      phase:
        type: choice
        options: [protect-origin, mapped]
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: openvaultdb-chinook-cloudrun-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: openvaultdb
      REGION: europe-west1
      SERVICE_NAME: chinook-ovdb
      OVDB_ORIGIN_SECRET_BINDING: ${{ vars.OVDB_ORIGIN_SECRET_BINDING }}
      OVDB_DEVICE_AUTH_PROXY_SECRET_BINDING: ${{ vars.OVDB_DEVICE_AUTH_PROXY_SECRET_BINDING }}
      SNEAT_API_ORIGIN: ${{ vars.SNEAT_API_ORIGIN }}
      OVDB_DEFAULT_ORIGIN_URL: ${{ vars.OVDB_DEFAULT_ORIGIN_URL }}
      OVDB_GOOGLE_ORIGIN_TARGET: ${{ vars.OVDB_GOOGLE_ORIGIN_TARGET }}
      OVDB_SECURE_ROLLBACK_REVISION: ${{ vars.OVDB_SECURE_ROLLBACK_REVISION }}
    steps:
      - name: Verify exact successful main artifact run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "${CI_RUN_ID}" =~ ^[0-9]+$ ]]
          gh api "repos/${REPOSITORY}/actions/runs/${CI_RUN_ID}" > run.json
          python3 - <<'PY'
          import json, os, re
          run=json.load(open("run.json"))
          if run.get("name") != "Cloud Go CI" or run.get("head_branch") != "main" or run.get("conclusion") != "success" or not re.fullmatch("[0-9a-f]{40}",run.get("head_sha","")):
              raise SystemExit("successful exact-main Go CI required")
          with open(os.environ["GITHUB_OUTPUT"],"a") as stream: stream.write("sha="+run["head_sha"]+"\n")
          PY

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ci.outputs.sha }}

      - name: Reject stale main
        env:
          DEPLOY_SHA: ${{ steps.ci.outputs.sha }}
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"

      - uses: actions/download-artifact@v8
        with:
          name: ovdb-cloud-linux-amd64
          path: server
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify binary identity and checksum
        env:
          DEPLOY_SHA: ${{ steps.ci.outputs.sha }}
        working-directory: server
        run: |
          test "$(cat ovdb-cloud.source-sha)" = "${DEPLOY_SHA}"
          sha256sum --check ovdb-cloud.sha256
          sha256sum --check provider-fixture.tar.sha256
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          # Accept only regular fixture files/directories; never links or escapes.
          with tarfile.open("provider-fixture.tar", "r:") as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  if (path.is_absolute() or ".." in path.parts
                          or path.parts[:2] != ("fixture", "output")
                          or not (member.isfile() or member.isdir())):
                      raise SystemExit(f"unsafe provider fixture archive entry: {member.name}")
              archive.extractall(".", filter="data")

          fixture = Path("fixture/output")
          inventory = json.loads((fixture / "inventory.json").read_text())
          if inventory.get("version") != 2 or not inventory.get("databases"):
              raise SystemExit("missing generated provider inventory")
          for database in inventory["databases"]:
              source_hash = (fixture / f"{database['id']}.source-sha256").read_text().strip()
              license_hash = sha256_file(fixture / database["license"])
              if database.get("storageEngine", "sqlite") == "ingitdb":
                  root = fixture / database["nativeRoot"]
                  actual = []
                  for pin in database["nativeFiles"]:
                      path = root / pin["path"]
                      if sha256_file(path) != pin["sha256"] or path.stat().st_size != pin["bytes"]:
                          raise SystemExit(f"native provider receipt mismatch: {database['id']} {pin['path']}")
                      actual.append(pin["path"])
                  if len(actual) != 8:
                      raise SystemExit("native provider inventory must contain exactly eight files")
                  serving_hash = database["servingSha256"]
              else:
                  serving_hash = sha256_file(fixture / f"{database['id']}.sqlite")
              if source_hash != database["sourceSha256"] or serving_hash != database["servingSha256"] or license_hash != database["licenseSha256"]:
                  raise SystemExit(f"provider receipt mismatch: {database['id']}")
          # data_filter makes files owner-writable; restore the verified image policy.
          for path in fixture.rglob("*"):
              if path.is_symlink() or not (path.is_file() or path.is_dir()):
                  raise SystemExit(f"unexpected extracted fixture entry: {path}")
              path.chmod(0o555 if path.is_dir() else 0o444)
          fixture.chmod(0o555)
          PY
          chmod +x ovdb-cloud


      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: projects/323159488879/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-chinook-deploy@openvaultdb.iam.gserviceaccount.com

      - name: Build the exact verified image
        env:
          DEPLOY_SHA: ${{ steps.ci.outputs.sha }}
        run: |
          gcloud auth login --brief --cred-file="${{ steps.auth.outputs.credentials_file_path }}"
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build --label "org.opencontainers.image.revision=${DEPLOY_SHA}" --file server/Dockerfile --tag "europe-west1-docker.pkg.dev/openvaultdb/chinook-ovdb/server:${DEPLOY_SHA}" server
          docker push "europe-west1-docker.pkg.dev/openvaultdb/chinook-ovdb/server:${DEPLOY_SHA}"

      - name: Load independently validated secure rollback receipt
        env:
          ROLLBACK_RECEIPT: ${{ vars.OVDB_SECURE_ROLLBACK_RECEIPT }}
        run: |
          printf '%s' "${ROLLBACK_RECEIPT}" > server/secure-rollback-acceptance.json

      - name: Deploy and verify named Go gateway revision
        working-directory: server
        env:
          DEPLOY_SHA: ${{ steps.ci.outputs.sha }}
          IMAGE: europe-west1-docker.pkg.dev/openvaultdb/chinook-ovdb/server:${{ steps.ci.outputs.sha }}
          DEPLOY_PHASE: ${{ inputs.phase }}
        run: python3 deploy_gateway.py --phase "${DEPLOY_PHASE}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ovdb-gateway-deployment
          if-no-files-found: warn
          path: |
            server/*receipt.json
