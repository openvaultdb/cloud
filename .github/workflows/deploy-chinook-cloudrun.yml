name: Deploy Chinook to Cloud Run

on:
  workflow_run:
    workflows: [Cloud Worker CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: openvaultdb-chinook-cloudrun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: openvaultdb
      REGION: europe-west1
      SERVICE_NAME: chinook-ovdb
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: europe-west1-docker.pkg.dev/openvaultdb/chinook-ovdb/server:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Reject an older main commit
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"

      - name: Download the validated Go binary
        uses: actions/download-artifact@v8
        with:
          name: ovdb-cloud-linux-amd64
          path: server
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify binary identity and checksum
        working-directory: server
        run: |
          test "$(cat ovdb-cloud.source-sha)" = "${DEPLOY_SHA}"
          sha256sum --check ovdb-cloud.sha256
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          fixture = Path("fixture/output")
          inventory = json.loads((fixture / "inventory.json").read_text())
          if inventory.get("version") != 2 or not inventory.get("databases"):
              raise SystemExit("missing generated provider inventory")
          for database in inventory["databases"]:
              source_hash = (fixture / f"{database['id']}.source-sha256").read_text().strip()
              license_hash = sha256_file(fixture / database["license"])
              if database.get("storageEngine", "sqlite") == "ingitdb":
                  root = fixture / database["nativeRoot"]
                  actual = []
                  for pin in database["nativeFiles"]:
                      path = root / pin["path"]
                      if sha256_file(path) != pin["sha256"] or path.stat().st_size != pin["bytes"]:
                          raise SystemExit(f"native provider receipt mismatch: {database['id']} {pin['path']}")
                      actual.append(pin["path"])
                  if len(actual) != 8:
                      raise SystemExit("native provider inventory must contain exactly eight files")
                  serving_hash = database["servingSha256"]
              else:
                  serving_hash = sha256_file(fixture / f"{database['id']}.sqlite")
              if source_hash != database["sourceSha256"] or serving_hash != database["servingSha256"] or license_hash != database["licenseSha256"]:
                  raise SystemExit(f"provider receipt mismatch: {database['id']}")
          PY
          chmod +x ovdb-cloud

      - name: Authenticate with OpenVaultDB Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/323159488879/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-chinook-deploy@openvaultdb.iam.gserviceaccount.com

      - name: Configure gcloud and Docker
        run: |
          gcloud auth login --brief --cred-file="${{ steps.auth.outputs.credentials_file_path }}"
          gcloud config set project "${PROJECT_ID}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the validated image
        run: |
          docker build --file server/Dockerfile --tag "${IMAGE}" server
          docker push "${IMAGE}"

      - name: Capture rollback target
        working-directory: server
        run: |
          gcloud run services describe "${SERVICE_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > prior-service.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          service=json.loads(Path("prior-service.json").read_text())
          status=service.get("status", {})
          spec=service.get("spec", {}).get("template", {}).get("spec", {})
          receipt={"priorRevision":status.get("latestReadyRevisionName"),"priorImage":(spec.get("containers") or [{}])[0].get("image")}
          if not receipt["priorRevision"] or not receipt["priorImage"]: raise SystemExit("rollback target is incomplete")
          Path("shipping-publication-deploy-receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          PY

      - name: Deploy the public read-only service
        run: |
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"
          # --concurrency is written out because the memory arithmetic in
          # server/limits.go depends on it (the platform default is 80);
          # TestCloudLimitsFitTheInstance reads it from here.
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --service-account=chinook-runtime@openvaultdb.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --concurrency=2 \
            --cpu=1 \
            --timeout=120 \
            --quiet

      - name: Record deployed service origin and source
        id: deployment
        working-directory: server
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(status.url)')
          test -n "${SERVICE_URL}"
          [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]
          python3 - "${SERVICE_URL}" <<'PY'
          import sys
          from urllib.parse import urlsplit

          origin = sys.argv[1]
          url = urlsplit(origin)
          if (any(ord(char) < 33 for char in origin)
                  or url.scheme != "https"
                  or not url.hostname or not url.hostname.endswith(".run.app")
                  or url.netloc != url.hostname
                  or url.path or url.query or url.fragment):
              raise SystemExit("invalid Chinook Cloud Run origin")
          PY
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"
          printf '%s\n' "${SERVICE_URL}" > chinook-run-origin.txt
          printf '%s\n' "${DEPLOY_SHA}" > chinook-deploy-sha.txt
          REVISION=$(gcloud run services describe "${SERVICE_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')
          IMAGE_DIGEST=$(gcloud artifacts docker images describe "${IMAGE}" --format='value(image_summary.digest)')
          python3 - "${DEPLOY_SHA}" "${REVISION}" "${IMAGE}" "${IMAGE_DIGEST}" "${SERVICE_URL}" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path("shipping-publication-deploy-receipt.json")
          receipt=json.loads(path.read_text()) if path.exists() else {}
          receipt.update(dict(zip(("mergeSha","deployedRevision","image","imageDigest","serviceOrigin"),sys.argv[1:])))
          path.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          PY
          echo "origin=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      # Live HTTP queries remain off until an operator explicitly opts in.
      # Deployment metadata above is required even when these checks are skipped.
      - name: Verify live profile and cacheable DTQL
        if: ${{ vars.OVDB_CLOUD_RUN_SMOKE_ENABLED == 'true' }}
        working-directory: server
        env:
          SERVICE_URL: https://cloud.openvaultdb.com
          SERVICE_ORIGIN: ${{ steps.deployment.outputs.origin }}
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${SERVICE_ORIGIN}/ovdb/dbs/chinook")" = 403
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            "${SERVICE_URL}/ovdb/dbs/chinook" > "${RUNNER_TEMP}/chinook-profile.html"
          grep -q 'https://cloud.openvaultdb.com/ovdb/dbs/chinook' "${RUNNER_TEMP}/chinook-profile.html"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            "${SERVICE_URL}/ovdb/dbs/chinook/collections/Album" > "${RUNNER_TEMP}/chinook-album.html"
          grep -q 'Database; enforcement: disabled' "${RUNNER_TEMP}/chinook-album.html"
          grep -q 'collections/Artist' "${RUNNER_TEMP}/chinook-album.html"
          grep -q 'collections/Track' "${RUNNER_TEMP}/chinook-album.html"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            "${SERVICE_URL}/ovdb/dbs/northwind" > "${RUNNER_TEMP}/northwind-profile.html"
          grep -q 'https://cloud.openvaultdb.com/ovdb/dbs/northwind' "${RUNNER_TEMP}/northwind-profile.html"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            "${SERVICE_URL}/ovdb/dbs/northwind/collections/Order%20Details" > "${RUNNER_TEMP}/northwind-order-details.html"
          grep -q 'Order Details' "${RUNNER_TEMP}/northwind-order-details.html"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            --dump-header "${RUNNER_TEMP}/chinook-headers" \
            --get --data-urlencode 'q=from: {name: Album}' \
            "${SERVICE_URL}/v1/databases/chinook/dtql" \
            --output "${RUNNER_TEMP}/chinook-result.json"
          jq -e '.records | length == 347' "${RUNNER_TEMP}/chinook-result.json"
          grep -iq '^cache-control: public, max-age=86400, s-maxage=86400' "${RUNNER_TEMP}/chinook-headers"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            --dump-header "${RUNNER_TEMP}/northwind-headers" \
            --header 'Origin: https://northwind.demodb.dev' \
            --header 'Content-Type: application/json' \
            --data '{"query":"from: {name: '\''Order Details'\''}\nlimit: 2\n"}' \
            "${SERVICE_URL}/v1/databases/northwind/dtql" \
            --output "${RUNNER_TEMP}/northwind-result.json"
          jq -e '.records | length == 2' "${RUNNER_TEMP}/northwind-result.json"
          jq -e '(.records | length == 2) and all(.records[]; (.data.id | type == "string") and ((.data.id | length) > 0) and (.key == ("Order Details/" + .data.id)))' "${RUNNER_TEMP}/northwind-result.json"
          grep -iq '^access-control-allow-origin: https://northwind.demodb.dev' "${RUNNER_TEMP}/northwind-headers"
          python3 smoke_inventory.py --origin "${SERVICE_URL}" --inventory fixture/output/inventory.json
          curl --fail-with-body --silent --show-error --header 'Content-Type: application/json' --data '{"query":"from: {name: requests}\nwhere: {op: ==, left: {field: order_id}, right: {value: 11062}}\nlimit: 1"}' "${SERVICE_URL}/v1/databases/shipping/dtql" | jq -e '.records | length == 1'
          curl --fail-with-body --silent --show-error --header 'Content-Type: application/json' --data '{"query":"from: {name: baseline}\nlimit: 100"}' "${SERVICE_URL}/v1/databases/shipping-logs/dtql" | jq -e 'any(.records[]; .key == "baseline/attempt-11062-1-e1")'
          for item in 'recovery11045example attempt-11045-2-e1' 'recovery11062example attempt-11062-2-e1'; do
            set -- ${item}
            curl --fail-with-body --silent --show-error "${SERVICE_URL}/v1/databases/shipping-logs/records/$1/$2" | jq -e --arg key "$2" '.data.event_id == $key'
          done
          for pair in 'shipping https://shipping.demodb.dev requests' 'shipping-logs https://shipping-logs.demodb.dev baseline'; do
            set -- ${pair}
            curl --fail-with-body --silent --show-error --dump-header "${RUNNER_TEMP}/cors-$1" --header "Origin: $2" --header 'Content-Type: application/json' --data "{\"query\":\"from: {name: $3}\\nlimit: 1\"}" "${SERVICE_URL}/v1/databases/$1/dtql" >/dev/null
            grep -iq "^access-control-allow-origin: $2" "${RUNNER_TEMP}/cors-$1"
          done
          test -z "$(curl --silent --dump-header - --output /dev/null --header 'Origin: https://undeclared.invalid' "${SERVICE_URL}/v1/databases/shipping" | grep -i '^access-control-allow-origin:' || true)"
          python3 - <<'PY'
          import json,hashlib,os,time
          from pathlib import Path
          receipt={"mergeSha":os.environ["DEPLOY_SHA"],"verifiedAt":int(time.time()),"checks":{"inventory":True,"shipping":True,"shippingLogs":True,"establishedProviders":True}}
          receipt["sha256"]=hashlib.sha256(json.dumps(receipt,sort_keys=True).encode()).hexdigest()
          Path("shipping-publication-live-receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          PY
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main) || exit 1
          test "${REMOTE_MAIN%%[[:space:]]*}" = "${DEPLOY_SHA}"

      - name: Roll back a failed publication
        if: ${{ failure() && hashFiles('server/shipping-publication-deploy-receipt.json') != '' }}
        working-directory: server
        env:
          SERVICE_URL: https://cloud.openvaultdb.com
          SERVICE_ORIGIN: ${{ steps.deployment.outputs.origin }}
        run: |
          PRIOR_REVISION=$(jq -r .priorRevision shipping-publication-deploy-receipt.json)
          gcloud run services update-traffic "${SERVICE_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --to-revisions="${PRIOR_REVISION}=100" --quiet
          for provider in adventureworks employees chinook northwind pubs sakila; do
            curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors "${SERVICE_URL}/ovdb/dbs/${provider}" >/dev/null
          done
          for candidate in shipping shipping-logs; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${SERVICE_URL}/ovdb/dbs/${candidate}")" = 404
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${SERVICE_ORIGIN}/ovdb/dbs/chinook")" = 403
          jq -n --arg trigger failure --arg failedMerge "${DEPLOY_SHA}" --arg restoredRevision "${PRIOR_REVISION}" '{trigger:$trigger,failedMerge:$failedMerge,restoredRevision:$restoredRevision,establishedProvidersVerified:true,candidatesAbsent:true,originSecretBoundaryVerified:true}' > shipping-publication-rollback-receipt.json

      - name: Publish deployment metadata for the Worker deploy
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: chinook-cloudrun-deployment
          path: |
            server/chinook-run-origin.txt
            server/chinook-deploy-sha.txt
            server/shipping-publication-deploy-receipt.json
            server/shipping-publication-live-receipt.json
            server/shipping-publication-rollback-receipt.json
          if-no-files-found: error
          retention-days: 7
