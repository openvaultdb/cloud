name: Actual corpus runtime candidate
on:
  pull_request:
    paths: ['server/**', '.github/workflows/actual-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-linux-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVDB_ACTUAL_EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      OVDB_ACTUAL_EVENT: ${{ github.event_name }}
    steps:
      - name: Start finite job budget before prerequisites
        run: echo "OVDB_ACTUAL_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache-dependency-path: server/go.sum
      - name: Full eight-provider candidate capacity experiment
        working-directory: server
        run: python3 test_actual_runtime.py
      - name: Preserve unconditional candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actual-runtime-candidate
          path: server/actual-runtime-report.json
          if-no-files-found: error
